<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>DevLinks</title>

    <!-- Fonte Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <div id="container">
      <!-- Perfil -->
      <div id="profile">
        <img
          src="./assets/avatar.png"
          alt="Foto de perfil"
        />

        <p>dandaratfaculdade</p>
      </div>

      <!-- Switch Light/Dark Mode -->
      <div id="switch" onclick="toggleMode()">
        <button></button>
        <span></span>
      </div>

      <!-- Links principais -->
      <ul>
        <li>
          <a href="https://github.com/dandarafaculdade" target="_blank">
            Meu GIT
          </a>
        </li>

        <li>
          <a href="https://www.linkedin.com/posts/dandara-tomalack-785368297_desenvolvimento-carreira-tecnologia-ugcPost-7500963950029717504-woUG/?utm_source=share&utm_medium=member_ios&rcm=ACoAAEfHNFUB9A6zhY7-vNe04vZ3O60ZprXO49E" target="_blank">
            Meu LinkedIn
          </a>
        </li>

        <li>
          <a href="https://github.com/dandarafaculdade/DAW-2026" target="_blank">
            Veja meu Projeto Web da Faculdade - DAW-2026 
          </a>
        </li>

        <li>
          <a href="https://github.com/dandarafaculdade/GitProjetoIotRafael" target="_blank">
            Veja meu Projeto Web da Faculdade - GitProjetoIotRafael
          </a>
        </li>
      </ul>

      <!-- Redes sociais -->
      <div id="social-links">
        <a
          href="#"
          target="_blank"
          aria-label="GitHub"
        >
          <ion-icon name="logo-github"></ion-icon>
        </a>

        <a
          href="#"
          target="_blank"
          aria-label="Instagram"
        >
          <ion-icon name="logo-instagram"></ion-icon>
        </a>

        <a
          href="#"
          target="_blank"
          aria-label="YouTube"
        >
          <ion-icon name="logo-youtube"></ion-icon>
        </a>

        <a
          href="#"
          target="_blank"
          aria-label="LinkedIn"
        >
          <ion-icon name="logo-linkedin"></ion-icon>
        </a>
      </div>

      <!-- Rodapé -->
      <footer>
        Feito com amor pela
        <a
          href="https://rocketseat.com.br"
          target="_blank"
        >
          Rocketseat
        </a>
      </footer>
    </div>

    <!-- Ionicons -->
    <script
      type="module"
      src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"
    ></script>

    <script
      nomodule
      src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"
    ></script>

    <!-- JavaScript -->
    <script src="./script.js"></script>

</html>
